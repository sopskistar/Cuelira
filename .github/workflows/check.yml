name: Verify Cuelira
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build-and-fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run sdk:probe -- --build-only
      - run: npm run sdk:native -- --list-only
      - run: npm test
      - run: npm run security
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep-invert 'native Electron'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-and-fixture-evidence
          path: artifacts/screenshots
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run sdk:probe -- --build-only
      - run: npm run sdk:native -- --list-only
      - run: npm test
      - run: npm run package:win
      - name: Verify packaged Windows app without camera or key
        run: node scripts/packaged-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-packaged-app-verification
          path: |
            artifacts/packaged-smoke.json
            artifacts/screenshots/packaged-win32-*.png
      - uses: actions/upload-artifact@v4
        with:
          name: Cuelira-Windows-unsigned
          path: release/*.exe
